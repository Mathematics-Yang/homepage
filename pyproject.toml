[project]
name = "homepage-mathematics-yang"
version = "0.1.0"
description = "Personal homepage for Jianan Yang"
requires-python = ">=3.10,<3.14"
dependencies = [
    "Flask==2.0.1",
    "requests==2.26.0",
    "python-dotenv==0.19.0",
    "markdown==3.10",
    "jinja2==3.0.1",
    "Werkzeug==2.0.1",
    "itsdangerous==2.0.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
